<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Docente UEES - Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&display=swap">
<link rel="stylesheet" href="src/css/styles.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<!-- VISTA: INICIO DE SESION   -->
<section id="view-login" class="screen active">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-logo">
        <picture>
          <source media="(max-width: 768px)" srcset="src/assets/img/isotipo-uees.png" width="150" height="98">
          <img src="src/assets/img/logo-uees.png" alt="Logo Universidad Evangélica de El Salvador" width="325" height="260">
        </picture>
      </div>
    </div>
    <div class="login-panel">
      <h1 class="login-title">PORTAL DOCENTE UEES</h1>
      <p class="login-subtitle">Inicia sesión para acceder a la cuenta</p>
      <form id="login-form" novalidate>
        <label class="field">
          <span class="field-label">
            <i class="bi bi-person" aria-hidden="true"></i>
            Usuario
          </span>
          <input type="text" id="login-user" placeholder="Docente@uees.edu.sv" autocomplete="username">
        </label>
        <label class="field">
          <span class="field-label">
            <i class="bi bi-lock" aria-hidden="true"></i>
            Contraseña
          </span>
          <input type="password" id="login-pass" placeholder="••••••••••••" autocomplete="current-password">
        </label>
        <p id="login-error" class="login-error" role="alert" hidden>Ingresa tu usuario y contraseña para continuar.</p>
        <div class="login-row">
          <label class="checkbox">
            <input type="checkbox" id="login-remember">
            Recordar sesión
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">INICIAR SESIÓN</button>
      </form>
      <p class="login-footer">&copy; 2026 Universidad Evangélica de El Salvador</p>
    </div>
  </div>
</section>
<script src="src/js/reglas.js"></script>
<script src="src/js/api.js"></script>
<script src="src/js/main.js"></script>
</body>
</html>
